<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking Orientación</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>Ranking de Orientación</h1>

    <div class="upload-box">
        <input type="file" id="fileInput" accept=".csv,.xml,.pdf">
        <button onclick="processFile()">Procesar archivo</button>
    </div>

    <p class="info">
        Compatible con:
        PDF OE2010, CSV y XML IOF
    </p>

    <table id="rankingTable">
        <thead>
            <tr>
                <th>Categoría</th>
                <th>Nombre</th>
                <th>Tiempo</th>
                <th>Puntos</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
